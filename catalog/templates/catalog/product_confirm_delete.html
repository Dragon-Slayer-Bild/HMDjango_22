{% extends 'catalog/base.html' %}
{% load my_tags %}

<head>
    <meta charset="UTF-8">
    <title>Удаление блога</title>
</head>

{% block content %}
    <div class="container mt-5">
        <h1 class="mb-4">Удаление продукта</h1>
        <p>Вы уверены, что хотите удалить продукт "{{ product.name }}"?</p>
        <form method="post">
            {% csrf_token %}
            {% if user.is_authenticated %}
            <button type="submit" class="btn btn-danger">Удалить</button>
            {% endif %}
            <a href="{% url 'catalog:product_list' %}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>

{% endblock %}
